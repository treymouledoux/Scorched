[package]
name = "scorched"
description = "A simple logging library for scorching all those pesky bugs."
version = "0.7.0"
edition = "2021"
rust-version = "1.70"
license = "MIT"
repository = "https://github.com/treymouledoux/Scorched"
readme = "README.md"
include = ["/src/**", "/tests/**", "/Cargo.toml", "/Cargo.lock", "/README.md", "/LICENSE", "/CHANGELOG.md"]

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
